[package]
name = "gltf-baker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gltf = { version = "1.4", features = ["import", "extensions"] }
roa_assets = { version = "0.1.0", path = "../../shared/assets", package = "roa-assets" }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.12"
