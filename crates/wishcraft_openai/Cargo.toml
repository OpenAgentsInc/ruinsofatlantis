[package]
name = "wishcraft_openai"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = ["responses"]
responses = []
chat = []
azure = []
stream = []
codex-adapter = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
dirs = "5"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
wishcraft = { path = "../wishcraft" }

[dev-dependencies]
assert_matches = "1"
httpmock = "0.7"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
