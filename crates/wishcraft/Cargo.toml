[package]
name = "wishcraft"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
# Placeholders for future integrations; kept empty to avoid cycles initially.
sim = []
server = []
schemars = ["dep:schemars"]
fs-ledger = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", optional = true }

[dev-dependencies]
serde_yaml = "0.9"

