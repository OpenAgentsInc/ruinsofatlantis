[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
# cargo-deny >=0.17: removed `vulnerability` and `unsound` keys; use defaults.
# Keep CI non-failing for maintenance churn and yanked crates.
unmaintained = "none"   # allowed values: all|workspace|transitive|none
yanked = "warn"          # allowed values: allow|warn|deny
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[licenses]
# cargo-deny >=0.17: removed `unlicensed`, `copyleft`, `allow-osi-fsf-free`, and `deny` keys.
# Rely on the explicit allow-list below and default behavior for the rest.
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]
# Treat internal workspace crates without a license field as private (do not fail CI)
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
