[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
vulnerability = "deny"
unsound = "deny"
# Scope for additional advisory checks (cargo-deny >=0.14 expects one of: "all", "workspace", "transitive", "none").
# We disable these categories in CI to avoid failing on ecosystem churn; enable locally as needed.
unmaintained = "none"
yanked = "none"
notice = "none"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[licenses]
unlicensed = "deny"
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Zlib"]
deny = []
copyleft = "warn"
allow-osi-fsf-free = "either"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
