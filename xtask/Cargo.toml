[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
data_runtime = { path = "../crates/data_runtime", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = "0.17"
naga = { version = "26.0.0", features = ["wgsl-in"] }
walkdir = "2.5.0"
wishcraft = { version = "0.1.0", path = "../crates/wishcraft" }
serde_yaml = "0.9"
wishcraft_openai = { version = "0.1.0", path = "../crates/wishcraft_openai" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
dirs = "5"
sha2 = "0.10.9"
chrono = "0.4.42"
tempfile = "3.23.0"
blake3 = "1.8.2"
hex = "0.4.3"
